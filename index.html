<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Galgame 丨 都给我三连😡😡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 把f12关了😡👊👊 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: none;
            touch-action: manipulation;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: #0a0a0f;
            color: #f0f0f0;
        }
        
        /* 配置界面🤓 */
        #configScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            z-index: 1000;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            padding: 20px;
            animation: fadeIn 0.5s ease-out;
        }
        
        .logo-area {
            text-align: center;
            margin: 20px 0 30px;
            padding: 0 10px;
        }
        
        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff7e5f, #feb47b, #ff9a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 5px 15px rgba(255, 126, 95, 0.2);
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        /* 卡片式设计😨 */
        .config-form {
            background: rgba(10, 10, 20, 0.7);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            animation: slideUp 0.6s ease-out 0.2s both;
        }
        
        .form-group {
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }
        
        .form-group:nth-child(1) { animation-delay: 0.3s; }
        .form-group:nth-child(2) { animation-delay: 0.4s; }
        .form-group:nth-child(3) { animation-delay: 0.5s; }
        .form-group:nth-child(4) { animation-delay: 0.6s; }
        .form-group:nth-child(5) { animation-delay: 0.7s; }
        .form-group:nth-child(6) { animation-delay: 0.8s; }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        label i {
            margin-right: 8px;
            color: #ff7e5f;
        }
        
        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #ff7e5f;
            background: rgba(30, 30, 40, 0.8);
            box-shadow: 0 0 0 3px rgba(255, 126, 95, 0.15);
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }
        
        /* 按钮样式优化🙄 */
        .btn {
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            color: #000;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 126, 95, 0.3);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px rgba(255, 126, 95, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6464ff 0%, #9d9dff 100%);
            box-shadow: 0 8px 20px rgba(100, 100, 255, 0.3);
        }
        
        .btn-tertiary {
            background: linear-gradient(135deg, #ff9a5f 0%, #ffc47b 100%);
            box-shadow: 0 8px 20px rgba(255, 154, 95, 0.3);
        }
        
        .btn-continue {
            background: linear-gradient(135deg, #20c997 0%, #3dd9a1 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(32, 201, 151, 0.3);
        }
        
        /* 优化设定按钮😡 */
        .btn-optimize {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(155, 89, 182, 0.3);
        }
        
        .btn-optimize:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
        }
        
        .btn-optimize:active {
            transform: scale(0.98);
        }
        
        .btn-optimize:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 上传区域美化😡 */
        .upload-area {
            text-align: center;
            padding: 25px;
            border: 2px dashed rgba(255, 126, 95, 0.3);
            border-radius: 16px;
            margin-bottom: 25px;
            background: rgba(20, 20, 30, 0.4);
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: rgba(255, 126, 95, 0.6);
            background: rgba(20, 20, 30, 0.6);
        }
        
        .upload-btn {
            background: rgba(255, 126, 95, 0.1);
            border: 2px solid rgba(255, 126, 95, 0.4);
            color: #ff7e5f;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .upload-btn:hover {
            background: rgba(255, 126, 95, 0.2);
            border-color: #ff7e5f;
            transform: translateY(-2px);
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 15px;
            border: 2px solid rgba(255, 126, 95, 0.3);
            display: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .upload-hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 10px;
            line-height: 1.5;
        }
        
        /* 游戏界面 */
        #gameScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 900;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }
        
        /* 移动端强制横屏😋 */
        @media (max-width: 768px) and (orientation: portrait) {
            #gameScreen {
                width: 100vh;
                height: 100vw;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
        }
        
        /* 游戏背景🥰 */
        .game-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: brightness(0.7);
        }
        
        /* 游戏内容区域 😋*/
        .game-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.3) 100%);
        }
        
        /* 游戏主区域😋 */
        .game-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            max-height: calc(100% - 130px);
        }
        
        /* 角色区域😋 */
        .character-area {
            flex: 0 0 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid rgba(255, 126, 95, 0.3);
            backdrop-filter: blur(5px);
        }
        
        .character {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            max-width: 90%;
            max-height: 90%;
        }
        
        .character-image {
            max-width: 100%;
            max-height: 70%;
            border-radius: 12px;
            border: 3px solid rgba(255, 126, 95, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            object-fit: cover;
            animation: float 6s ease-in-out infinite;
        }
        
        .character-icon {
            font-size: 5rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
            display: none;
        }
        
        .character-name {
            font-size: 1.4rem;
            color: #ff7e5f;
            font-weight: 700;
            text-align: center;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 126, 95, 0.3);
            margin-top: 20px;
            backdrop-filter: blur(5px);
            letter-spacing: 1px;
        }
        
        /* 对话区域 */
        .dialogue-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            overflow: hidden;
            min-width: 0;
            backdrop-filter: blur(5px);
        }
        
        /* 对话内容😋 */
        .conversation-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
        }
        
        .dialogue-content {
            font-size: 1.05rem;
            line-height: 1.6;
            min-height: 100%;
        }
        
        .dialogue-message {
            margin-bottom: 16px;
            padding: 16px 20px;
            border-radius: 12px;
            animation: fadeInUp 0.4s ease-out;
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid;
            backdrop-filter: blur(5px);
        }
        
        .player-message {
            border-left-color: #ff7e5f;
            margin-left: 10px;
            background: rgba(255, 126, 95, 0.08);
        }
        
        .ai-message {
            border-left-color: #4a90e2;
            margin-right: 10px;
            background: rgba(74, 144, 226, 0.08);
        }
        
        .message-sender {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #ff7e5f;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .ai-message .message-sender {
            color: #4a90e2;
        }
        
        .message-text {
            line-height: 1.6;
            font-size: 1rem;
        }
        
        /* 状态指示器😡 */
        .status-indicator {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.25);
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }
        
        .affection-status {
            color: #ff7e5f;
        }
        
        .mood-status {
            color: #4a90e2;
        }
        
        .expression-status {
            color: #9b59b6;
        }
        
        .status-label {
            font-weight: 600;
        }
        
        .status-value {
            font-weight: 700;
        }
        
        /* 选项区域 */
        .options-area {
            height: 130px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid rgba(255, 126, 95, 0.3);
            display: flex;
            align-items: center;
            padding: 0 20px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            position: relative;
            z-index: 5;
            flex-shrink: 0;
            scroll-behavior: smooth;
            backdrop-filter: blur(10px);
        }
        
        .options-container {
            display: flex;
            gap: 15px;
            height: 100%;
            align-items: center;
            padding: 15px 0;
            width: max-content;
            min-width: 100%;
        }
        
        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 126, 95, 0.4);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            padding: 16px 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            max-width: 280px;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.5;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }
        
        .option-btn:hover {
            background: rgba(255, 126, 95, 0.15);
            border-color: #ff7e5f;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }
        
        .option-btn:active {
            transform: translateY(-1px);
        }
        
        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .option-number {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 0.85rem;
            color: rgba(255, 126, 95, 0.8);
            font-weight: 700;
        }
        
        /* 自定义输入选项 😡*/
        .custom-option-btn {
            background: rgba(100, 100, 255, 0.1);
            border: 2px solid rgba(100, 100, 255, 0.4);
        }
        
        .custom-option-btn:hover {
            background: rgba(100, 100, 255, 0.2);
            border-color: #6464ff;
        }
        
        .custom-option-btn .option-number {
            color: rgba(100, 100, 255, 0.8);
        }
        
        /* 控制按钮 😡*/
        .controls-area {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 126, 95, 0.4);
            color: #fff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }
        
        .control-btn:hover {
            background: rgba(255, 126, 95, 0.2);
            transform: translateY(-2px);
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .reload-control-btn {
            border-color: rgba(32, 201, 151, 0.4);
        }
        
        .reload-control-btn:hover {
            background: rgba(32, 201, 151, 0.2);
        }
        
        /* 加载动画 🤔*/
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 126, 95, 0.2);
            border-radius: 50%;
            border-top-color: #ff7e5f;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            color: #ff7e5f;
            font-size: 1.1rem;
            padding: 12px 24px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            text-align: center;
            backdrop-filter: blur(5px);
        }
        
        /* 自定义输入对话框 */
        .custom-input-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .custom-input-container {
            background: rgba(20, 20, 30, 0.9);
            border: 1px solid rgba(100, 100, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            animation: popIn 0.4s ease-out;
        }
        
        .custom-input-title {
            font-size: 1.3rem;
            color: #6464ff;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .custom-input-field {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .custom-input-field:focus {
            outline: none;
            border-color: #6464ff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(100, 100, 255, 0.15);
        }
        
        .custom-input-buttons {
            display: flex;
            gap: 12px;
        }
        
        .custom-input-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        .custom-input-submit {
            background: linear-gradient(135deg, #6464ff 0%, #9d9dff 100%);
            color: white;
        }
        
        .custom-input-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .custom-input-btn:active {
            transform: scale(0.98);
        }
        
        /* 提醒 */
        .reminder-overlay {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #ff7e5f;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            z-index: 1100;
            text-align: center;
            border: 1px solid rgba(255, 126, 95, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.5s ease-out;
            backdrop-filter: blur(10px);
            max-width: 90%;
        }
        
        .reminder-close {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 28px;
            height: 28px;
            background: rgba(255, 126, 95, 0.9);
            border-radius: 50%;
            border: none;
            color: #000;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .reminder-close:hover {
            transform: scale(1.1);
        }
        
        /* 优化加载提示 */
        .optimize-loading {
            display: none;
            color: #9b59b6;
            font-size: 0.95rem;
            margin-top: 8px;
            align-items: center;
            gap: 10px;
        }
        
        .optimize-loading i {
            animation: spin 1s linear infinite;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        /* 隐藏类 */
        .hidden {
            display: none !important;
        }
        
        /* 错误消息 */
        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #ff3e3e;
            color: #ff9d9d;
            padding: 18px;
            border-radius: 12px;
            margin-top: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            backdrop-filter: blur(5px);
        }
        
        .error-title {
            color: #ff7e5f;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .error-solution {
            margin-top: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #ff7e5f;
        }
        
        .error-code {
            font-family: 'Consolas', 'Monaco', monospace;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin: 6px 0;
            overflow-x: auto;
        }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 126, 95, 0.3);
            border-radius: 8px;
            border: 2px solid rgba(0, 0, 0, 0.1);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 126, 95, 0.5);
        }
        
        /* 响应式优化 */
        @media (max-width: 1024px) {
            .character-area {
                flex: 0 0 35%;
            }
            
            .option-btn {
                min-width: 160px;
                padding: 14px 18px;
            }
        }
        
        @media (max-width: 768px) {
            .logo {
                font-size: 2.2rem;
            }
            
            .config-form {
                padding: 20px;
            }
            
            .character-area {
                flex: 0 0 40%;
            }
            
            .option-btn {
                min-width: 140px;
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            
            .controls-area {
                top: 10px;
                right: 10px;
            }
            
            .control-btn {
                width: 42px;
                height: 42px;
                font-size: 1rem;
            }
            
            /* 移动端强制横屏优化 */
            @media (orientation: portrait) {
                #gameScreen {
                    width: 100vh;
                    height: 100vw;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%) rotate(90deg);
                    transform-origin: center center;
                }
                
                .options-area {
                    height: 120px;
                    padding: 0 15px;
                }
            }
        }
        
        @media (max-width: 480px) {
            .logo {
                font-size: 1.8rem;
            }
            
            .config-form {
                padding: 16px;
            }
            
            .character-area {
                flex: 0 0 45%;
                padding: 15px;
            }
            
            .option-btn {
                min-width: 130px;
                padding: 10px 14px;
                font-size: 0.85rem;
                min-height: 70px;
            }
            
            .options-area {
                height: 110px;
                padding: 0 12px;
            }
            
            .controls-area {
                top: 8px;
                right: 8px;
                gap: 8px;
            }
            
            .control-btn {
                width: 38px;
                height: 38px;
                font-size: 0.9rem;
            }
        }
    </style>

<body>
    <!-- 提醒 -->
    <div class="reminder-overlay" id="reminderOverlay">
        <div style="margin-bottom: 5px;">✨ 版本 1.5 ✨</div>
        <div>去给作者三连😡😡有问题请联系作者</div>
        <button class="reminder-close" id="reminderClose">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <!-- 配置界面 -->
    <div id="configScreen">
        <div class="logo-area">
            <div class="logo">AI Galgame</div>
            <div class="subtitle">AI全参与gala</div>
        </div>
        
        <div class="config-form">
            <!-- 背景图片上传 -->
            <div class="upload-area">
                <div class="form-group">
                    <label for="bgImageUpload"><i class="fas fa-image"></i> 上传背景图片</label>
                    <input type="file" id="bgImageUpload" accept="image/*" style="display: none;">
                    <div class="upload-btn" id="bgUploadBtn">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>选择背景图片</span>
                    </div>
                    <img id="bgImagePreview" class="image-preview" alt="背景预览">
                    <div class="upload-hint">上传一张横屏图片作为游戏背景（建议尺寸：1920×1080）</div>
                </div>
            </div>
            
            <!-- 角色图片上传 -->
            <div class="upload-area">
                <div class="form-group">
                    <label for="characterImageUpload"><i class="fas fa-user-circle"></i> 上传角色图片（可选）</label>
                    <input type="file" id="characterImageUpload" accept="image/*" style="display: none;">
                    <div class="upload-btn" id="characterUploadBtn">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>选择角色图片</span>
                    </div>
                    <img id="characterImagePreview" class="image-preview" alt="角色预览">
                    <div class="upload-hint">上传一张角色图片，将显示在游戏左侧（可选）</div>
                </div>
            </div>
            
            <!-- API设置 -->
            <div class="form-group">
                <label for="apiUrl"><i class="fas fa-link"></i> API端点URL</label>
                <input type="text" id="apiUrl" placeholder="例如：https://api.example.com/v1/chat/completions" value="">
                <div class="upload-hint" style="margin-top: 8px; color: #ff7e5f;">
                    💡 提示：大多数API需要在URL末尾添加 <code>/chat/completions</code>
                </div>
            </div>
            
            <div class="form-group">
                <label for="apiKey"><i class="fas fa-key"></i> API密钥</label>
                <input type="password" id="apiKey" placeholder="输入您的API密钥">
                <div class="upload-hint" style="margin-top: 8px; color: #ff7e5f;">
                    🔑 密钥可在API服务商处获取，部分本地API可留空
                </div>
            </div>
            
            <div class="form-group">
                <label for="modelName"><i class="fas fa-microchip"></i> 模型名称</label>
                <input type="text" id="modelName" placeholder="例如：deepseek-ai/DeepSeek-R1" value="">
                <div class="upload-hint" style="margin-top: 8px; color: #ff7e5f;">
                    🤖 请填写API支持的模型名称，可在服务商文档中查找
                </div>
            </div>
            
            <div class="form-group">
                <label for="characterName"><i class="fas fa-user"></i> 角色名称</label>
                <input type="text" id="characterName" placeholder="例如：AI女友" value="猫娘女友">
            </div>
            
            <div class="form-group">
                <label for="systemPrompt"><i class="fas fa-book"></i> 角色设定</label>
                <div style="margin-bottom: 12px;">
                    <button id="optimizePromptBtn" class="btn-optimize">
                        <i class="fas fa-magic"></i> 使用AI优化设定
                    </button>
                    <div id="optimizeLoading" class="optimize-loading hidden">
                        <i class="fas fa-spinner"></i> AI正在优化设定中...
                    </div>
                </div>
                <textarea id="systemPrompt" placeholder="描述角色的性格、背景、说话风格等设定...">你是一个猫娘，与user是情侣关系，语气可爱粘人</textarea>
                <div class="upload-hint" style="margin-top: 8px; color: #9b59b6;">
                    ✨ 点击上方按钮，AI将自动优化您的角色设定
                </div>
            </div>
            
            <div class="form-group">
                <label for="initialPrompt"><i class="fas fa-play-circle"></i> 初始对话</label>
                <input type="text" id="initialPrompt" placeholder="输入开场对话..." value="你好，今天过得怎么样？">
            </div>
            
            <!-- 按钮组 -->
            <button id="startGameBtn" class="btn">
                <i class="fas fa-play"></i> 开始新游戏
            </button>
            
            <button id="continueGameBtn" class="btn btn-continue hidden">
                <i class="fas fa-play-circle"></i> 继续游戏
            </button>
            
            <button id="restoreDefaultBtn" class="btn btn-tertiary">
                <i class="fas fa-undo"></i> 恢复默认设置
            </button>
            
            <button id="clearStorageBtn" class="btn btn-secondary">
                <i class="fas fa-trash"></i> 清除缓存配置
            </button>
        </div>
    </div>
    
    <!-- 游戏界面 -->
    <div id="gameScreen" class="hidden">
        <!-- 游戏背景 -->
        <div class="game-bg" id="gameBackground"></div>
        
        <!-- 游戏内容 -->
        <div class="game-content">
            <!-- 主游戏区域 -->
            <div class="game-area">
                <!-- 左侧角色区域 -->
                <div class="character-area">
                    <div class="character">
                        <img id="characterImage" class="character-image hidden" alt="角色图片">
                        <i class="fas fa-user-circle character-icon" id="characterIcon"></i>
                        <div class="character-name" id="characterNameDisplay">猫娘女友</div>
                    </div>
                </div>
                
                <!-- 右侧对话区域 -->
                <div class="dialogue-area">
                    <div class="conversation-container" id="conversationContainer">
                        <div class="dialogue-content" id="dialogueContent">
                            <!-- 对话内容将动态显示在这里 -->
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 底部选项区域 -->
            <div class="options-area" id="optionsArea">
                <div class="options-container" id="optionsContainer">
                    <!-- 选项按钮将动态生成在这里 -->
                </div>
            </div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls-area">
            <button class="control-btn" id="backToConfigBtn" title="返回设置（保存进度）">
                <i class="fas fa-cog"></i>
            </button>
            <button class="control-btn" id="resetGameBtn" title="重新开始">
                <i class="fas fa-redo"></i>
            </button>
            <button class="control-btn reload-control-btn" id="reloadConversationBtn" title="重新加载对话">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        
        <!-- 加载遮罩 -->
        <div class="loading-overlay hidden" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">AI正在思考中...请稍候(速度取决于模型质量)</div>
        </div>
        
        <!-- 自定义输入对话框 -->
        <div class="custom-input-overlay hidden" id="customInputOverlay">
            <div class="custom-input-container">
                <div class="custom-input-title">
                    <i class="fas fa-keyboard"></i> 自定义输入
                </div>
                <input type="text" class="custom-input-field" id="customInputField" placeholder="请输入您想说的话...">
                <div class="custom-input-buttons">
                    <button class="custom-input-btn custom-input-submit" id="customInputSubmit">发送</button>
                    <button class="custom-input-btn custom-input-cancel" id="customInputCancel">取消</button>
                </div>
            </div>
        </div>
    </div>
