cale(0.98)}.btn-optimize:disabled{opacity:0.6;cursor:not-allowed}.upload-area{text-align:center;padding:25px;border:2px dashed rgba(255,126,95,0.3);border-radius:16px;margin-bottom:25px;background:rgba(20,20,30,0.4);transition:all 0.3s ease}.upload-area:hover{border-color:rgba(255,126,95,0.6);background:rgba(20,20,30,0.6)}.upload-btn{background:rgba(255,126,95,0.1);border:2px solid rgba(255,126,95,0.4);color:#ff7e5f;padding:14px 24px;border-radius:10px;font-size:1rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:12px;margin-bottom:20px;transition:all 0.3s ease}.upload-btn:hover{background:rgba(255,126,95,0.2);border-color:#ff7e5f;transform:translateY(-2px)}.image-preview{max-width:100%;max-height:200px;border-radius:10px;margin-top:15px;border:2px solid rgba(255,126,95,0.3);display:none;box-shadow:0 8px 20px rgba(0,0,0,0.3)}#gameScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:900;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn 0.5s ease-out}@media(max-width:768px)and(orientation:portrait){#gameScreen{width:100vh;height:100vw;top:50%;left:50%;transform:translate(-50%,-50%)rotate(90deg);transform-origin:center center}}.game-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:1;filter:brightness(0.7)}.game-content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,0.1)30%,rgba(0,0,0,0.3)100%)}.game-area{flex:1;display:flex;overflow:hidden;position:relative;max-height:calc(100% - 130px)}.character-area{flex:0 0 40%;display:flex;justify-content:center;align-items:center;position:relative;padding:20px;overflow:hidden;background:rgba(0,0,0,0.2);border-right:1px solid rgba(255,126,95,0.3);backdrop-filter:blur(5px)}.character{display:flex;flex-direction:column;justify-content:center;align-items:center;width:10 ctive{transform:scale(0.95)}.reload-control-btn{border-color:rgba(32,201,151,0.4)}.reload-control-btn:hover{background:rgba(32,201,151,0.2)}.loading-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px)}.loading-spinner{width:60px;height:60px;border:4px solid rgba(255,126,95,0.2);border-radius:50%;border-top-color:#ff7e5f;animation:spin 1s linear infinite;margin-bottom:20px}.loading-text{color:#ff7e5f;font-size:1.1rem;padding:12px 24px;border-radius:10px;background:rgba(0,0,0,0.3);text-align:center;backdrop-filter:blur(5px)}.custom-input-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:20;display:flex;justify-content:center;align-items:center;padding:20px;backdrop-filter:blur(10px)}.custom-input-container{background:rgba(20,20,30,0.9);border:1px solid rgba(100,100,255,0.3);border-radius:20px;padding:25px;width:100%;max-width:500px;box-shadow:0 20px 40px rgba(0,0,0,0.6);backdrop-filter:blur(10px);animation:popIn 0.4s ease-out}.custom-input-title{font-size:1.3rem;color:#6464ff;margin-bottom:20px;text-align:center;font-weight:600}.custom-input-field{width:100%;padding:16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:#fff;font-size:1rem;margin-bottom:20px;transition:all 0.3s ease}.custom-input-field:focus{outline:none;border-color:#6464ff;background:rgba(255,255,255,0.12);box-shadow:0 0 0 3px rgba(100,100,255,0.15)}.custom-input-buttons{display:flex;gap:12px}.custom-input-btn{flex:1;padding:14px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;border:none;transition:all 0.3s ease;box-shadow:0 6px 15px rgba(0,0,0,0.3)}.custom-input-submit{background:linear-gradient(135deg,#6464ff 0%,#9d9dff 100%);color:white}.custom-input-cancel{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.
