<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZSC 丨 Galgame - AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: none;
            touch-action: manipulation;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: #000;
            color: #fff;
        }
        
        /* 配置界面 - 移动端竖屏 */
        #configScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            z-index: 1000;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        .logo {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }
        
        .config-form {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #ff7e5f;
            background: rgba(255, 255, 255, 0.15);
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
            line-height: 1.5;
        }
        
        .form-row {
            display: flex;
            gap: 10px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .btn {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: linear-gradient(90deg, #6464ff, #9d9dff);
            margin-top: 5px;
        }
        
        /* 上传图片区域 */
        .upload-area {
            text-align: center;
            padding: 20px;
            border: 2px dashed rgba(255, 126, 95, 0.5);
            border-radius: 12px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .upload-btn {
            background: rgba(255, 126, 95, 0.2);
            border: 2px solid rgba(255, 126, 95, 0.5);
            color: #ff7e5f;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .upload-btn:hover {
            background: rgba(255, 126, 95, 0.3);
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 15px;
            border: 2px solid rgba(255, 126, 95, 0.3);
            display: none;
        }
        
        .upload-hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        /* 游戏主界面 - 移动端强制横屏 */
        #gameScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 900;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 移动端强制横屏 */
        @media (max-width: 768px) and (orientation: portrait) {
            #gameScreen {
                width: 100vh;
                height: 100vw;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
        }
        
        /* 全屏背景 */
        .game-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }
        
        /* 游戏内容区域 - 透明 */
        .game-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3); /* 半透明背景，保证文字可读性 */
        }
        
        /* 顶部背景和角色区域 */
        .game-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            background: transparent; /* 透明背景 */
            max-height: calc(100% - 120px); /* 减去底部选项区域高度 */
        }
        
        /* 左侧角色区域 */
        .character-area {
            flex: 0 0 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 15px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3); /* 半透明背景，保证文字可读性 */
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
            border-right: 3px solid rgba(255, 126, 95, 0.7);
        }
        
        .character {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            max-width: 90%;
            max-height: 90%;
        }
        
        .character-image {
            max-width: 100%;
            max-height: 70%;
            border-radius: 10px;
            border: 3px solid rgba(255, 126, 95, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            object-fit: cover;
        }
        
        .character-icon {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.5));
            display: none;
        }
        
        .character-name {
            font-size: 1.3rem;
            color: #ff7e5f;
            font-weight: bold;
            text-align: center;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(255, 126, 95, 0.3);
            margin-top: 15px;
            backdrop-filter: blur(10px);
        }
        
        /* 右侧对话区域 */
        .dialogue-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3); /* 半透明背景，保证文字可读性 */
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
            overflow: hidden;
            min-width: 0;
        }
        
        /* 对话内容区域 */
        .conversation-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
        }
        
        .dialogue-content {
            font-size: 1rem;
            line-height: 1.5;
            min-height: 100%;
        }
        
        .dialogue-message {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
            background: rgba(0, 0, 0, 0.5); /* 半透明背景，保证文字可读性 */
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
        }
        
        .player-message {
            border-left: 3px solid #ff7e5f;
            margin-left: 5px;
        }
        
        .ai-message {
            border-left: 3px solid #4a90e2;
            margin-right: 5px;
        }
        
        .message-sender {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #ff7e5f;
        }
        
        .ai-message .message-sender {
            color: #4a90e2;
        }
        
        .message-text {
            line-height: 1.5;
            font-size: 0.95rem;
        }
        
        /* 底部选项区域 - 横向排列 */
        .options-area {
            height: 120px;
            background: rgba(0, 0, 0, 0.3); /* 半透明背景 */
            border-top: 3px solid rgba(255, 126, 95, 0.7);
            display: flex;
            align-items: center;
            padding: 0 15px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            position: relative;
            z-index: 5;
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
            flex-shrink: 0;
        }
        
        .options-container {
            display: flex;
            gap: 10px;
            height: 100%;
            align-items: center;
            padding: 10px 0;
            width: max-content;
            min-width: 100%;
        }
        
        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 126, 95, 0.5);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            padding: 12px 15px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            max-width: 250px;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.4;
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
        }
        
        .option-btn:active {
            background: rgba(255, 126, 95, 0.3);
            border-color: #ff7e5f;
            transform: translateY(-3px);
        }
        
        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 126, 95, 0.1) 50%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .option-btn:hover::before,
        .option-btn:active::before {
            opacity: 1;
        }
        
        .option-btn span {
            position: relative;
            z-index: 2;
        }
        
        .option-number {
            position: absolute;
            top: 6px;
            left: 10px;
            font-size: 0.8rem;
            color: rgba(255, 126, 95, 0.8);
            font-weight: bold;
        }
        
        /* 自定义输入选项 */
        .custom-option-btn {
            background: rgba(100, 100, 255, 0.2);
            border: 2px solid rgba(100, 100, 255, 0.5);
        }
        
        .custom-option-btn:active {
            background: rgba(100, 100, 255, 0.3);
            border-color: #6464ff;
        }
        
        .custom-option-btn .option-number {
            color: rgba(100, 100, 255, 0.8);
        }
        
        /* 自定义输入对话框 */
        .custom-input-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .custom-input-container {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(100, 100, 255, 0.5);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        
        .custom-input-title {
            font-size: 1.2rem;
            color: #6464ff;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .custom-input-field {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        
        .custom-input-field:focus {
            outline: none;
            border-color: #6464ff;
        }
        
        .custom-input-buttons {
            display: flex;
            gap: 10px;
        }
        
        .custom-input-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        
        .custom-input-submit {
            background: linear-gradient(90deg, #6464ff, #9d9dff);
            color: white;
        }
        
        .custom-input-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .custom-input-btn:active {
            transform: scale(0.98);
        }
        
        /* 控制按钮 */
        .controls-area {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }
        
        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 126, 95, 0.5);
            color: #fff;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        
        .control-btn:active {
            background: rgba(255, 126, 95, 0.3);
            transform: scale(0.95);
        }
        
        /* 加载遮罩 - 修改为半透明模糊遮罩而不是全黑 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* 改为半透明 */
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px); /* 模糊效果 */
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 126, 95, 0.3);
            border-radius: 50%;
            border-top-color: #ff7e5f;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading-text {
            color: #ff7e5f;
            font-size: 1rem;
        }
        
        /* 隐藏类 */
        .hidden {
            display: none !important;
        }
        
        /* 桌面端样式 */
        @media (min-width: 1025px) {
            .character-area {
                flex: 0 0 35%;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            .config-form {
                padding: 25px;
            }
            
            .option-btn {
                min-width: 180px;
                font-size: 1rem;
            }
            
            .dialogue-message {
                padding: 12px 15px;
                font-size: 1.1rem;
            }
            
            .message-text {
                font-size: 1.05rem;
            }
        }
        
        /* 移动端横屏优化 */
        @media (max-width: 1024px) and (orientation: landscape) {
            /* 原生横屏模式 */
            #gameScreen {
                transform: none;
            }
            
            .character-area {
                flex: 0 0 35%;
            }
            
            .controls-area {
                top: 10px;
                right: 10px;
            }
            
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .dialogue-message {
                padding: 10px 12px;
                margin-bottom: 12px;
            }
            
            .option-btn {
                min-width: 140px;
                padding: 12px 15px;
                font-size: 0.9rem;
            }
        }
        
        /* 移动端强制横屏 */
        @media (max-width: 768px) and (orientation: portrait) {
            #gameScreen {
                width: 100vh;
                height: 100vw;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
            
            .character-area {
                flex: 0 0 40%;
            }
            
            .conversation-container {
                padding: 12px;
            }
            
            .dialogue-content {
                font-size: 0.95rem;
            }
            
            .dialogue-message {
                padding: 8px 10px;
                margin-bottom: 10px;
                font-size: 0.9rem;
            }
            
            .message-text {
                font-size: 0.9rem;
            }
            
            .option-btn {
                min-width: 130px;
                padding: 10px 12px;
                font-size: 0.85rem;
                min-height: 65px;
            }
            
            .options-area {
                height: 110px;
                padding: 0 12px;
            }
            
            .controls-area {
                top: 8px;
                right: 8px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 0.9rem;
            }
        }
        
        /* 非常小的屏幕设备 */
        @media (max-width: 480px) {
            .character-area {
                flex: 0 0 45%;
            }
            
            .option-btn {
                min-width: 120px;
                padding: 8px 10px;
                font-size: 0.8rem;
                min-height: 60px;
            }
            
            .options-area {
                height: 100px;
                padding: 0 10px;
            }
            
            .options-container {
                gap: 8px;
            }
            
            .logo {
                font-size: 1.8rem;
            }
            
            .config-form {
                padding: 15px;
            }
        }
        
        /* 滚动条样式 - 优化移动端滚动条 */
        ::-webkit-scrollbar {
            width: 12px; /* 增加宽度 */
            height: 12px; /* 增加高度 */
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px; /* 增加圆角 */
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 126, 95, 0.5);
            border-radius: 6px; /* 增加圆角 */
            border: 2px solid rgba(0, 0, 0, 0.2); /* 添加边框增加可见性 */
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 126, 95, 0.7);
        }
        
        /* 移动端滚动条优化 */
        @media (max-width: 768px) {
            ::-webkit-scrollbar {
                width: 14px; /* 移动端更宽 */
                height: 14px; /* 移动端更高 */
            }
            
            ::-webkit-scrollbar-thumb {
                min-height: 40px; /* 确保滑块足够大 */
                min-width: 40px; /* 确保滑块足够大 */
            }
        }
        
        /* 选项区域滚动条优化 */
        .options-area::-webkit-scrollbar {
            height: 16px; /* 水平滚动条更高 */
        }
        
        .options-area::-webkit-scrollbar-thumb {
            background: rgba(255, 126, 95, 0.7);
            border-radius: 8px;
            border: 3px solid rgba(0, 0, 0, 0.3); /* 更明显的边框 */
        }
        
        .options-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin: 0 10px; /* 添加边距 */
        }
    </style>
</head>
<body>
    <!-- 配置界面 - 移动端竖屏 -->
    <div id="configScreen">
        <div class="logo-area">
            <div class="logo">AI Galgame</div>
            <div class="subtitle">全部基于AI的galagame</div>
        </div>
        
        <div class="config-form">
            <!-- 上传背景图片区域 -->
            <div class="upload-area">
                <div class="form-group">
                    <label for="bgImageUpload"><i class="fas fa-image"></i> 上传背景图片</label>
                    <input type="file" id="bgImageUpload" accept="image/*" style="display: none;">
                    <div class="upload-btn" id="bgUploadBtn">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>选择背景图片</span>
                    </div>
                    <img id="bgImagePreview" class="image-preview" alt="背景预览">
                    <div class="upload-hint">上传一张图片作为游戏背景（建议使用横屏图片）</div>
                </div>
            </div>
            
            <!-- 上传角色图片区域 -->
            <div class="upload-area">
                <div class="form-group">
                    <label for="characterImageUpload"><i class="fas fa-user-circle"></i> 上传角色图片（可选）</label>
                    <input type="file" id="characterImageUpload" accept="image/*" style="display: none;">
                    <div class="upload-btn" id="characterUploadBtn">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>选择角色图片</span>
                    </div>
                    <img id="characterImagePreview" class="image-preview" alt="角色预览">
                    <div class="upload-hint">上传一张角色图片，将显示在游戏左侧（可选）</div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="apiUrl"><i class="fas fa-link"></i> API端点URL</label>
                <input type="text" id="apiUrl" placeholder="请填写标准链接" value="">

            <div class="form-group">
                <label for="apiKey"><i class="fas fa-key"></i> API密钥</label>
                <input type="password" id="apiKey" placeholder="输入您的API密钥">
            </div>
            
            <div class="form-group">
                <label for="modelName"><i class="fas fa-microchip"></i> 模型名称</label>
                <input type="text" id="modelName" placeholder="例如: deepseek-ai/DeepSeek-R1" value="">
            </div>
            
            <div class="form-group">
                <label for="characterName"><i class="fas fa-user"></i> 角色名称</label>
                <input type="text" id="characterName" placeholder="例如: AI女友" value="猫娘女友">
            </div>
            
            <div class="form-group">
                <label for="systemPrompt"><i class="fas fa-book"></i> 角色设定</label>
                <textarea id="systemPrompt" placeholder="在这里描述角色的性格、背景、说话风格等设定。AI回复的格式已固定为JSON格式，无需在此处指定。">你是一个猫娘，与user是情侣关系，语气可爱粘人</textarea>
            </div>
            
            <div class="form-group">

                <input type="text" id="initialPrompt" placeholder="例如:自己想😡👊👊" value="自己想😡👊👊">
            </div>
            
            <button id="startGameBtn" class="btn">
                <i class="fas fa-play"></i> 开始游戏
            </button>
            
            <button id="clearStorageBtn" class="btn btn-secondary">

            </button>

    <!-- 游戏界面 - 移动端强制横屏 -->
    <div id="gameScreen" class="hidden">
        <!-- 全屏背景 -->
        <div class="game-bg" id="gameBackground"></div>
        
        <!-- 游戏内容区域 -->
        <div class="game-content">
            <!-- 主游戏区域 -->
            <div class="game-area">
                <!-- 左侧角色区域 -->
                <div class="character-area">
                    <div class="character">
                        <img id="characterImage" class="character-image hidden" alt="角色图片">
                        <i class="fas fa-user-circle character-icon" id="characterIcon"></i>
                        <div class="character-name" id="characterNameDisplay">猫娘女友</div>
                    </div>
                </div>
                
                <!-- 右侧对话区域 -->
                <div class="dialogue-area">
                    <!-- 对话内容区域 -->
                    <div class="conversation-container" id="conversationContainer">
                        <div class="dialogue-content" id="dialogueContent">
                            <!-- 对话内容将动态显示在这里 -->
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 底部选项区域 -->
            <div class="options-area" id="optionsArea">
                <div class="options-container" id="optionsContainer">
                    <!-- 选项按钮将动态生成在这里 -->
                </div>
            </div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls-area">
            <button class="control-btn" id="backToConfigBtn" title="返回设置">
                <i class="fas fa-cog"></i>
            </button>
            <button class="control-btn" id="resetGameBtn" title="重新开始">
                <i class="fas fa-redo"></i>
            </button>
        </div>
        
        <!-- 加载遮罩 - 现在是半透明模糊遮罩 -->
        <div class="loading-overlay hidden" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">AI思考中不要退出...</div>
        </div>
        
        <!-- 自定义输入对话框 -->
        <div class="custom-input-overlay hidden" id="customInputOverlay">
            <div class="custom-input-container">
                <div class="custom-input-title">
                    <i class="fas fa-keyboard"></i> 自定义输入
                </div>
                <input type="text" class="custom-input-field" id="customInputField" placeholder="请输入您想说的话...">
                <div class="custom-input-buttons">
                    <button class="custom-input-btn custom-input-submit" id="customInputSubmit">发送</button>
                    <button class="custom-input-btn custom-input-cancel" id="customInputCancel">取消</button>
                </div>
            </div>
        </div>
    </div>
